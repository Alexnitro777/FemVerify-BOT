services:
  bot:
    build: .
    image: your-image-name:latest
    container_name: your-container-name
    init: true
    restart: unless-stopped
    tty: true
    environment:
      NODE_ENV: production
      # Подключение к MariaDB/MySQL (единственная конфигурация вне БД).
      DB_HOST: your-mariadb-host
      DB_PORT: "3306"
      DB_USER: femverify
      DB_PASSWORD: ""
      DB_NAME: femverify
      # Только для первого запуска: бот запишет их в таблицу app_config и дальше
      # читает оттуда — после старта эти строки можно убрать. Либо внесите token и
      # clientId напрямую в app_config (SQL) и не задавайте их здесь вовсе.
      BOT_TOKEN: ""
      CLIENT_ID: ""
      # Опционально: ID основного сервера, где разрешена подача апелляций (/апелляция,
      # /амнистии и форма апелляции). Если не указан — апелляции разрешены везде.
      # Сохраняется в app_config (ключ mainGuildId).
      MAIN_GUILD_ID: ""
      # Опционально: ссылка-приглашение на основной сервер (для вывода пользователям).
      # Сохраняется в app_config (ключ mainGuildInvite).
      MAIN_GUILD_INVITE: ""
